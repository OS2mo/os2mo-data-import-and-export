query Me {
  me {
    actor {
      uuid
    }
  }
}

mutation address_refresh($owner: UUID!, $cursor: Cursor = null, $limit: int!) {
  address_refresh(owner: $owner, cursor: $cursor, limit: $limit) {
    objects
    page_info {
      next_cursor
    }
  }
}

