"Event.\n\nYou need to use the `token` to acknowledge that the event has been handled properly by calling `event_acknowledge`.\n\nYour integration is supposed to handle *all* events that the listener subscribes to. If your integration does not need to do anything for a particular event, it still needs to be acknowledged.\n\nYou might see events in the `events` collection that you do not appear to receive when calling `event_fetch`. This is because OS2mo will not spam you with the same event over and over if it fails.\n"
type Event {
  """
  An identifier of the subject. All subjects in the (default) "mo" namespace have UUIDs as identifier.
  """
  subject: String!

  """Priority of the event."""
  priority: Int!

  "EventTokens are opaque tokens needed to acknowledge events.\n"
  token: EventToken!
}

"""Acknowledge an event."""
input EventAcknowledgeInput {
  token: EventToken!
}

"""Event creation time filter."""
input EventCreatedAtFilter {
  """Only match events created at or after this time."""
  start: DateTime = null

  """Only match events created before this time."""
  end: DateTime = null
}

"""Event filter."""
input EventFilter {
  """ID of listener."""
  listener: UUID!
}

"""Rerun all matching events."""
input EventRerunInput {
  listeners: ListenerFilter = null
  subjects: [String!] = null
  priorities: [Int!] = null
  silenced: Boolean = null
}

input EventSendInput {
  """Namespace to send the event in."""
  namespace: String!

  """Routing key of the event."""
  routing_key: String!

  """Subject the event is about."""
  subject: String!

  """Priority of the event. 1 is the highest priority."""
  priority: Int! = 10000
}

"Silence an event.\n\nSilencing does not affect delivery, it only affects whether alerts are triggered.\n"
input EventSilenceInput {
  """Only silence the event for these listeners."""
  listeners: ListenerFilter!

  """Subjects to silence."""
  subjects: [String!]!
}

"Event tokens are used for event related operations, such as acknowledgment.\n\nThis is an opaque value and as such, you should *never* depend on the actual value.\n\nYou should not store it for later or construct it yourself, as newer MO versions can change the underlying implementation.\n"
scalar EventToken

"""Unsilence all matching events."""
input EventUnsilenceInput {
  listeners: ListenerFilter = null
  subjects: [String!] = null
  priorities: [Int!] = null
}

